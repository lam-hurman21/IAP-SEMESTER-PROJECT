{% extends 'base.html' %}
{% block title %}Register | Campus Supply{% endblock %}
{% block content %}
<section class="intro"><h1>Create an account</h1><p class="lead">Join Campus Supply.</p></section>
<div class="form-panel">
    <form method="post">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        <button type="submit" class="button">Create account</button>
    </form>
    <p>Already registered? <a href="{% url 'products:login' %}">Log in</a>.</p>
</div>
{% endblock %}
