{% extends 'base.html' %}
{% block title %}Log in | Campus Supply{% endblock %}
{% block content %}
<section class="intro"><h1>Log in</h1><p class="lead">Welcome back to Campus Supply.</p></section>
<div class="form-panel">
    <form method="post">
        {% csrf_token %}
        {% include 'includes/form_fields.html' %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button type="submit" class="button">Log in</button>
    </form>
    <p>New here? <a href="{% url 'products:register' %}">Create an account</a>.</p>
</div>
{% endblock %}
